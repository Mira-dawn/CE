<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1180" viewBox="0 0 940 1180" font-family="'Noto Sans CJK SC','Noto Serif CJK SC',sans-serif">
  <!-- 外框 -->
  <rect x="0" y="0" width="940" height="1180" rx="12" fill="#0A0D13" stroke="#1e2735" stroke-width="2"/>

  <!-- ===== 标题条 ===== -->
  <rect x="0" y="0" width="940" height="76" rx="12" fill="#0F141C"/>
  <rect x="0" y="70" width="940" height="6" fill="#38BDF8"/>
  <!-- logo 圆 -->
  <circle cx="46" cy="38" r="24" fill="#1b2740" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="46" cy="38" r="14" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="41" cy="35" r="3" fill="#06121C"/><circle cx="51" cy="35" r="3" fill="#06121C"/>
  <path d="M40 44 q6 5 12 0" stroke="#06121C" stroke-width="2" fill="none"/>
  <!-- 标题文字 -->
  <text x="86" y="38" fill="#EEF3FB" font-size="24" font-weight="bold">AOB 符号脚本生成器</text>
  <text x="86" y="60" fill="#A7B5C9" font-size="14">一行指令 → 一份可直接启用的常规 AOB 脚本</text>
  <!-- 版本徽章 -->
  <rect x="690" y="24" width="230" height="30" rx="5" fill="#141A24" stroke="#E0A64B" stroke-width="1.5"/>
  <text x="805" y="44" fill="#E0A64B" font-size="14" font-weight="bold" text-anchor="middle">v2.7.0-DLL · 2026-11-14</text>
  <!-- 深色外观 -->
  <rect x="690" y="58" width="120" height="0" fill="none"/>

  <!-- 卡片通用：x=28 width=884 -->
  <!-- ===== ① 指令内容 ===== -->
  <rect x="28" y="92" width="884" height="164" rx="8" fill="#141A24" stroke="#1e2735"/>
  <rect x="40" y="104" width="4" height="20" fill="#38BDF8"/>
  <text x="54" y="120" fill="#EEF3FB" font-size="17" font-weight="bold">① 指令内容</text>
  <text x="200" y="120" fill="#A7B5C9" font-size="13">支持「地址 - 字节 - 指令」与纯指令两种写法</text>
  <rect x="792" y="102" width="104" height="28" rx="5" fill="none" stroke="#A7B5C9"/>
  <text x="844" y="121" fill="#A7B5C9" font-size="14" text-anchor="middle">取代码</text>
  <text x="44" y="150" fill="#A7B5C9" font-size="12">粘贴那一行指令（可多行）</text>
  <rect x="44" y="158" width="852" height="60" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="56" y="180" fill="#7dd3fc" font-family="Noto Sans CJK SC,sans-serif" font-size="13">004A2B3C - 89 81 60 55 00 00 - mov [ecx+00005560],eax</text>
  <text x="44" y="240" fill="#A7B5C9" font-size="12">格式: 004A2B3C - 89 81 60 55 00 00 - mov [ecx+00005560],eax（也认纯指令）</text>

  <!-- ===== ② 符号与定位 ===== -->
  <rect x="28" y="268" width="884" height="164" rx="8" fill="#141A24" stroke="#1e2735"/>
  <rect x="40" y="280" width="4" height="20" fill="#38BDF8"/>
  <text x="54" y="296" fill="#EEF3FB" font-size="17" font-weight="bold">② 符号与定位</text>
  <text x="200" y="296" fill="#A7B5C9" font-size="13">符号名会注册进 CE 的符号表，勾选脚本即生效</text>
  <!-- 行1 -->
  <text x="44" y="330" fill="#EEF3FB" font-size="13" font-weight="bold">符号名</text>
  <rect x="110" y="316" width="150" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="120" y="334" fill="#7dd3fc" font-size="13" font-family="Noto Sans CJK SC,sans-serif">aob_base</text>
  <text x="290" y="330" fill="#EEF3FB" font-size="13" font-weight="bold">记录名</text>
  <rect x="356" y="316" width="190" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="580" y="330" fill="#EEF3FB" font-size="13">[x] 锁定首次</text>
  <!-- 行2 -->
  <text x="44" y="372" fill="#EEF3FB" font-size="13" font-weight="bold">条件判断</text>
  <rect x="110" y="358" width="330" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="120" y="376" fill="#A7B5C9" font-size="12">=200 / rsi=0C / [模块+偏移]</text>
  <rect x="470" y="356" width="130" height="30" rx="5" fill="#38BDF8"/>
  <text x="535" y="376" fill="#06121C" font-size="14" font-weight="bold" text-anchor="middle">生成脚本</text>
  <rect x="610" y="357" width="100" height="28" rx="5" fill="none" stroke="#A7B5C9"/>
  <text x="660" y="376" fill="#A7B5C9" font-size="13" text-anchor="middle">清空输入</text>
  <rect x="720" y="357" width="100" height="28" rx="5" fill="none" stroke="#A7B5C9"/>
  <text x="770" y="376" fill="#A7B5C9" font-size="13" text-anchor="middle">清空日志</text>
  <text x="44" y="412" fill="#A7B5C9" font-size="12">条件留空 = 无条件记最后一次；支持 值条件 / 寄存器条件 / 指针 / 数据地址</text>

  <!-- ===== ③ 选项 ===== -->
  <rect x="28" y="444" width="884" height="164" rx="8" fill="#141A24" stroke="#1e2735"/>
  <rect x="40" y="456" width="4" height="20" fill="#E0A64B"/>
  <text x="54" y="472" fill="#EEF3FB" font-size="17" font-weight="bold">③ 选项</text>
  <text x="150" y="472" fill="#A7B5C9" font-size="13">影响定位方式、脚本体积与是否附带改值</text>
  <text x="44" y="510" fill="#EEF3FB" font-size="13">[x] 用 模块+偏移 定位</text>
  <text x="250" y="510" fill="#EEF3FB" font-size="13">[ ] 加密输出</text>
  <text x="410" y="510" fill="#EEF3FB" font-size="13">[ ] 生成时附带改值</text>
  <text x="620" y="510" fill="#EEF3FB" font-size="13">[ ] 精简注释</text>
  <text x="44" y="540" fill="#EEF3FB" font-size="13">[x] 生成时自检</text>
  <text x="250" y="540" fill="#EEF3FB" font-size="13">[ ] 硬件断点模式（无痕）</text>
  <!-- 语义 -->
  <text x="44" y="578" fill="#EEF3FB" font-size="13" font-weight="bold">语义</text>
  <rect x="95" y="564" width="180" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="105" y="582" fill="#7dd3fc" font-size="13">容器（不含索引） ▾</text>
  <text x="295" y="582" fill="#A7B5C9" font-size="12">容器 = 不含索引；元素 = 含索引；两种记录都是 符号+偏移0</text>

  <!-- ===== ④ 附带改值 ===== -->
  <rect x="28" y="620" width="884" height="120" rx="8" fill="#141A24" stroke="#1e2735"/>
  <rect x="40" y="632" width="4" height="20" fill="#38BDF8"/>
  <text x="54" y="648" fill="#EEF3FB" font-size="17" font-weight="bold">④ 附带改值</text>
  <text x="180" y="648" fill="#A7B5C9" font-size="13">需先勾选「生成时附带改值」</text>
  <text x="60" y="692" fill="#EEF3FB" font-size="13" font-weight="bold">运算</text>
  <rect x="110" y="678" width="130" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="120" y="696" fill="#7dd3fc" font-size="13">写入值 ▾</text>
  <text x="264" y="692" fill="#EEF3FB" font-size="13" font-weight="bold">操作数</text>
  <rect x="330" y="678" width="120" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="340" y="696" fill="#7dd3fc" font-size="13">9999</text>
  <text x="474" y="692" fill="#EEF3FB" font-size="13" font-weight="bold">偏移</text>
  <rect x="520" y="678" width="80" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="530" y="696" fill="#7dd3fc" font-size="13">0</text>
  <text x="626" y="692" fill="#EEF3FB" font-size="13" font-weight="bold">类型</text>
  <rect x="672" y="678" width="140" height="26" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="682" y="696" fill="#7dd3fc" font-size="13">4字节 ▾</text>

  <!-- ===== ⑤ 结果输出 ===== -->
  <rect x="28" y="752" width="884" height="176" rx="8" fill="#141A24" stroke="#1e2735"/>
  <rect x="40" y="764" width="4" height="20" fill="#38BDF8"/>
  <text x="54" y="780" fill="#EEF3FB" font-size="17" font-weight="bold">⑤ 结果输出</text>
  <text x="180" y="780" fill="#A7B5C9" font-size="13">生成的脚本与运行日志</text>
  <rect x="44" y="792" width="852" height="124" rx="4" fill="#0A0D13" stroke="#1e2735"/>
  <text x="56" y="814" fill="#E0A64B" font-family="Noto Sans CJK SC,sans-serif" font-size="12">[版本] AOB 符号脚本生成器 v2.7.0-DLL（构建 2026-11-14）已加载</text>
  <text x="56" y="836" fill="#7dd3fc" font-family="Noto Sans CJK SC,sans-serif" font-size="12">[取代码] 004A2B3C - 89 81 60 55 00 00 - mov [ecx+00005560],eax</text>
  <text x="56" y="858" fill="#A7B5C9" font-family="Noto Sans CJK SC,sans-serif" font-size="12">[注入] 覆盖 6 字节：jmp 5 字节 + 1 字节 90 填充</text>
  <text x="56" y="880" fill="#8ee6a8" font-family="Noto Sans CJK SC,sans-serif" font-size="12">[提示] 脚本已复制到剪贴板（1842 字符），直接粘进 CE 的自动汇编窗口</text>
  <text x="56" y="902" fill="#A7B5C9" font-family="Noto Sans CJK SC,sans-serif" font-size="12">[界面体检] 卡片底=图形控件(TShape)；文字 42 处，被窗口控件遮挡 0 处</text>

  <!-- ===== 底部工具条 ===== -->
  <rect x="0" y="1096" width="940" height="84" fill="#0F141C"/>
  <rect x="0" y="1095" width="940" height="1" fill="#1e2735"/>
  <rect x="28" y="1114" width="130" height="40" rx="6" fill="none" stroke="#A7B5C9" stroke-width="1.5"/>
  <text x="93" y="1139" fill="#EEF3FB" font-size="14" text-anchor="middle">复制脚本</text>
  <rect x="168" y="1114" width="130" height="40" rx="6" fill="none" stroke="#A7B5C9" stroke-width="1.5"/>
  <text x="233" y="1139" fill="#EEF3FB" font-size="14" text-anchor="middle">另存为…</text>
  <rect x="308" y="1114" width="130" height="40" rx="6" fill="none" stroke="#A7B5C9" stroke-width="1.5"/>
  <text x="373" y="1139" fill="#EEF3FB" font-size="14" text-anchor="middle">加到列表</text>
  <rect x="448" y="1114" width="120" height="40" rx="6" fill="#38BDF8"/>
  <text x="508" y="1139" fill="#06121C" font-size="14" font-weight="bold" text-anchor="middle">生成EXE</text>
  <rect x="578" y="1114" width="120" height="40" rx="6" fill="#38BDF8"/>
  <text x="638" y="1139" fill="#06121C" font-size="14" font-weight="bold" text-anchor="middle">生成DLL</text>
  <text x="912" y="1139" fill="#A7B5C9" font-size="12" text-anchor="end">勾选脚本激活后再导出</text>
</svg>
